                    <div class="logo-section">
                        <div class="logo">
                            <img src="/asset/images/logo.svg" alt="logo" width="360" height="auto">
                        </div>
                    </div>
                    <div class="header-actions">

                            <div class="input-icon">
                                <img src="asset/images/password-icon.svg" width="22" height="22" alt="">

                            <input type="password" id="password" placeholder="Password" required>
                        </div>

                        </div>
