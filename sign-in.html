<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolii - Sign In</title>
    <link rel="stylesheet" href="asset/css/global.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="sign-in-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-container">
                    <div class="logo-section">
                        <div class="logo">
                            <img src="/asset/images/logo.svg" alt="logo" width="360" height="auto">
                        </div>
                    </div>
                    <div class="header-actions">
                        <nav class="navigation">
                            <a href="#" class="nav-button">Security</a>
                            <a href="sign-in.html" class="nav-button">Login</a>
                        </nav>
                        <a href="sign-up.html" class="signup-button">Sign Up</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sign In Form Section -->
            <section class="form-section">
                <div class="form-container">
                    <header class="form-header">
                        <div class="form-logo">
                            <img src="/asset/images/logo-short.svg" alt="logo" width="260" height="auto">
                        </div>
                        <h2 class="form-title">MEDICAL DOCUMENT UPLOAD</h2>
                    </header>

                    <form class="signin-form" id="signinForm">
                        <div class="input-field">
                            <div class="input-icon">
                                <img src="asset/images/email-icon.svg" width="22" height="22" alt="">
                            </div>
                            <input name="email" type="email" id="email" placeholder="Email Address">

                        </div>
                            <span class="signIn-error-message"></span>

                        <div class="input-field">
                            <div class="input-icon">
                                <img src="asset/images/password-icon.svg" width="22" height="22" alt="">

                            </div>
                            <input name="password" type="password" id="password" placeholder="Password">

                        </div>
                            <span class="signIn-error-message"></span>

                        <div class="form-options">
                            <div class="remember-me">
                                <div class="checkbox-container" id="rememberCheckbox">
                                    <div class="checkbox-filled">
                                        <svg width="23" height="23" viewBox="0 0 23 23" fill="none"
                                            xmlns="http://www.w3.org/2000/svg" class="check-icon">
                                            <path d="M18.6665 5.6001L8.39982 15.8668L3.73315 11.2001" stroke="white"
                                                stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                                            </path>
                                        </svg>
                                    </div>
                                </div>
                                <label for="rememberCheckbox">Remember me</label>
                            </div>
                            <button type="button" class="forgot-password">Forgot password?</button>
                        </div>

                        <!-- Captcha -->
                        <div class="signUp-captcha-box me-auto">
                            <div class="signUp-checkbox-wrapper mt-0">
                                <div class="signUp-checkbox-container">
                                    <input type="checkbox" id="robotCheck" class="signUp-checkbox-input" name="robot-check">
                                    <label for="robotCheck" class="signUp-checkbox-label">
                                        <span class="signUp-checkbox-custom"></span>
                                        <span class="signUp-checkbox-text">I'm not a robot</span>
                                    </label>
                                </div>
                                <img src="asset/images/recaptcha.svg" alt="reCAPTCHA logo" class="signUp-captcha-logo">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="signin-button" id="signinButton">
                                Sign In
                            </button>

                            <p class="or-text">OR</p>

                            <button type="button" class="google-button">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <g clip-path="url(#clip0_52768_1573)">
                                        <path
                                            d="M23.7663 12.2763C23.7663 11.4605 23.7001 10.6404 23.559 9.83789H12.2402V14.4589H18.722C18.453 15.9492 17.5888 17.2676 16.3233 18.1054V21.1037H20.1903C22.4611 19.0137 23.7663 15.9272 23.7663 12.2763Z"
                                            fill="#4285F4"></path>
                                        <path
                                            d="M12.2401 24.0008C15.4766 24.0008 18.2059 22.9382 20.1945 21.1039L16.3276 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.2401 24.0008Z"
                                            fill="#34A853"></path>
                                        <path
                                            d="M5.50277 14.3002C5.00011 12.8099 5.00011 11.196 5.50277 9.70569V6.61475H1.51674C-0.185266 10.0055 -0.185266 14.0004 1.51674 17.3912L5.50277 14.3002Z"
                                            fill="#FBBC04"></path>
                                        <path
                                            d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.2401 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.2401 4.74966Z"
                                            fill="#EA4335"></path>
                                    </g>
                                    <defs>
                                        <clipPath id="clip0_52768_1573">
                                            <rect width="24" height="24" fill="white"></rect>
                                        </clipPath>
                                    </defs>
                                </svg>
                                Login with Google
                            </button>
                        </div>
                    </form>

                    <p class="signup-text mb-0">
                        Don't have an account?
                        <a href="sign-up.html" class="create-account-link">Create Account</a>
                    </p>
                </div>
            </section>


            <img src="asset/images/avatar-main.svg" class="right__img illustration-image"
                alt="Medical document upload illustration">
        </main>
    </div>


    <!-- SCRIPTS INCLUSION  -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="./asset/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
